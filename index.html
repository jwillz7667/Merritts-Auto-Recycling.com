<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1F33">
  <title>Down for Maintenance | Merritt&rsquo;s Auto Recycling</title>
  <style>
    :root { color-scheme: light; --navy: #0b1f33; --graphite: #101820; --orange: #f26a21; --cream: #f7f5f0; --steel: #617080; --white: #ffffff; }
    * { box-sizing: border-box; }
    html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--navy); }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top right, #173b5f 0, var(--navy) 42%, #071421 100%); color: var(--graphite); }
    main { width: min(100%, 720px); background: var(--cream); border-radius: 18px; overflow: hidden; box-shadow: 0 28px 80px rgba(0,0,0,.32); }
    .stripe { height: 9px; background: var(--orange); }
    .content { padding: clamp(32px, 7vw, 64px); text-align: center; }
    .brand { margin: 0 0 28px; color: var(--navy); font-size: clamp(1rem, 3vw, 1.2rem); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .eyebrow { margin: 0 0 10px; color: var(--steel); font-size: .82rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--graphite); font-size: clamp(2.35rem, 8vw, 4.75rem); line-height: .95; letter-spacing: -.045em; }
    .message { max-width: 560px; margin: 24px auto 0; color: #344352; font-size: clamp(1.05rem, 2.5vw, 1.25rem); line-height: 1.65; }
    .call { display: inline-flex; min-height: 56px; align-items: center; justify-content: center; margin-top: 30px; padding: 15px 28px; border-radius: 8px; background: var(--orange); color: var(--white); font-size: clamp(1.05rem, 3vw, 1.25rem); font-weight: 850; text-decoration: none; box-shadow: 0 9px 22px rgba(171,62,0,.24); }
    .call:hover { background: #d94f08; }
    .call:focus-visible { outline: 4px solid #123f66; outline-offset: 4px; }
    .hours { margin: 18px 0 0; color: var(--steel); font-size: .95rem; }
    .address { margin: 34px 0 0; padding-top: 24px; border-top: 1px solid #d8d6d0; color: var(--steel); font-size: .9rem; line-height: 1.55; }
    @media (max-width: 430px) { body { padding: 12px; } main { border-radius: 12px; } .content { padding-inline: 22px; } .call { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <div class="stripe" aria-hidden="true"></div>
    <div class="content">
      <p class="brand">Merritt&rsquo;s Auto Recycling</p>
      <p class="eyebrow">Website update in progress</p>
      <h1>Down for maintenance</h1>
      <p class="message">We&rsquo;re improving our website. For inquiries, call Merritt&rsquo;s Auto Recycling and our team will be glad to help.</p>
      <a class="call" href="tel:+1-763-533-2775" aria-label="Call Merritt's Auto Recycling at 763-533-2775">Call 763-533-2775</a>
      <p class="hours">Open daily, 9:00 AM&ndash;6:00 PM</p>
      <p class="address">3106 68th Ave N<br>Brooklyn Center, MN 55429</p>
    </div>
  </main>
</body>
</html>
