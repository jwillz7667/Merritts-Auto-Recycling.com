<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1F33">
  <title>Website Down for Maintenance | Merritt&rsquo;s Auto Recycling</title>
  <style>
    :root { color-scheme: light; --navy: #0b1f33; --graphite: #101820; --orange: #f26a21; --cream: #f7f5f0; --steel: #617080; --white: #fff; }
    * { box-sizing: border-box; }
    html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--navy); }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 20px; background: var(--navy); color: var(--graphite); }
    main { width: min(100%, 720px); overflow: hidden; border-radius: 16px; background: var(--cream); box-shadow: 0 28px 80px rgba(0,0,0,.32); text-align: center; }
    .stripe { height: 9px; background: var(--orange); }
    .content { padding: clamp(34px, 8vw, 68px) clamp(22px, 7vw, 58px); }
    .brand { margin: 0 0 30px; color: var(--navy); font-size: clamp(1rem, 3vw, 1.2rem); font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .label { margin: 0 0 12px; color: var(--steel); font-size: .82rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--graphite); font-size: clamp(2.2rem, 7.5vw, 4.5rem); line-height: 1; letter-spacing: -.045em; }
    .message { margin: 24px auto 0; color: #344352; font-size: clamp(1.08rem, 3vw, 1.3rem); line-height: 1.6; }
    .call { display: inline-flex; min-height: 58px; align-items: center; justify-content: center; margin-top: 30px; padding: 15px 28px; border-radius: 8px; background: var(--orange); color: var(--white); font-size: clamp(1.08rem, 3vw, 1.25rem); font-weight: 850; text-decoration: none; }
    .hours { margin: 18px 0 0; color: var(--steel); font-size: 1rem; font-weight: 700; }\n    .call:hover { background: #d94f08; }
    .call:focus-visible { outline: 4px solid #123f66; outline-offset: 4px; }
    @media (max-width: 430px) { body { padding: 12px; } main { border-radius: 12px; } .call { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <div class="stripe" aria-hidden="true"></div>
    <div class="content">
      <p class="brand">Merritt&rsquo;s Auto Recycling</p>
      <p class="label">Site maintenance</p>
      <h1>This website is down for maintenance.</h1>
      <p class="message">For inquiries, call <strong>763-533-2775</strong>.</p>
      <a class="call" href="tel:+1-763-533-2775" aria-label="Call Merritt's Auto Recycling at 763-533-2775">Call 763-533-2775</a>\n      <p class="hours">Open every day, 8:00 AM&ndash;8:00 PM</p>
    </div>
  </main>
</body>
</html>
