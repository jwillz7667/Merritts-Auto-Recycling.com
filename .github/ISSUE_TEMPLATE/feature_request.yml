name: Feature request
description: Propose a new feature, page, or content surface.
title: '[feat]: '
labels:
  - enhancement
  - triage
assignees:
  - jwillz7667
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user / business outcome is hurt by the absence of this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: true
      options:
        - New page
        - New service-area city
        - New blog post
        - Forms / lead capture
        - Structured data / schema
        - Performance
        - Accessibility
        - SEO
        - Build pipeline
        - Hosting / infra
        - Analytics / tracking
        - Other
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: How will we know it worked?
      description: What metric or check confirms success? (Search Console clicks, Lighthouse score, conversion rate, etc.)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: input
    id: deadline
    attributes:
      label: Deadline / urgency
      placeholder: e.g. "before next merge freeze 2026-06-01"
