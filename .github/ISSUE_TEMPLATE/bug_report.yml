name: Bug report
description: Something on the site is broken or behaving incorrectly.
title: '[bug]: '
labels:
  - bug
  - triage
assignees:
  - jwillz7667
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more specific the
        repro, the faster we can ship a fix.

  - type: input
    id: page
    attributes:
      label: Page URL
      description: Full URL where you saw the problem.
      placeholder: https://merritts-auto-recycling.com/placemarks/blaine-mn
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: What surface is affected?
      multiple: true
      options:
        - Homepage
        - Contact form
        - Quote form
        - Appointment form
        - Placemark (per-city) page
        - Blog
        - FAQ
        - Testimonials
        - Sitemap / robots / llms.txt
        - Structured data (JSON-LD)
        - Performance / Core Web Vitals
        - Accessibility
        - SEO / canonical / redirects
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. Observe …
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + OS + device
      placeholder: Safari 17 on iPhone 15, iOS 17.4
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: Screenshots / console logs / network
      description: Drop screenshots or paste console output.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I checked the live site in an incognito window (rules out cache).
          required: true
        - label: I checked the browser console for errors.
          required: false
