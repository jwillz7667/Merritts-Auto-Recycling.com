name: Prepare dependency patch for review
on:
  push:
    branches: ['fix/dependency-patch-review-2026-10-16']
    paths: ['.github/workflows/prepare-dependency-patch.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refresh only within existing package ranges without lifecycle scripts
        run: npm update --package-lock-only --ignore-scripts --no-audit
      - name: Record versions and audit the candidate lock
        run: |
          mkdir -p .sites-runtime
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const originalPackage = execFileSync('git', ['show', 'HEAD:package.json'], { encoding: 'utf8' });
          if (readFileSync('package.json', 'utf8') !== originalPackage) throw new Error('Refresh unexpectedly changed declared dependency ranges.');
          const changes = Object.entries(after.packages).filter(([path, item]) => item.version !== before.packages[path]?.version).map(([path, item]) => ({ path, before: before.packages[path]?.version ?? null, after: item.version, resolved: item.resolved }));
          const summary = { basedOn: process.env.GITHUB_SHA, declaredRangesUnchanged: true, changes };
          writeFileSync('.sites-runtime/dependency-changes.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE
          npm audit --json > .sites-runtime/candidate-audit.json || test "$?" = 1
      - name: Store candidate lock blob without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const repository = 'jwillz7667/Merritts-Auto-Recycling.com';
          if (process.env.GITHUB_REPOSITORY !== repository || process.env.GITHUB_REF !== 'refs/heads/fix/dependency-patch-review-2026-10-16') throw new Error('Unexpected repository or branch.');
          const content = readFileSync('package-lock.json', 'utf8');
          const lock = JSON.parse(content);
          if (lock.name !== 'merritts-auto-recycling' || lock.lockfileVersion !== 3 || content.length > 1000000) throw new Error('Unexpected lockfile.');
          const sha = createHash('sha1').update(`blob ${Buffer.byteLength(content)}\0`).update(content).digest('hex');
          const response = await fetch(`https://api.github.com/repos/${repository}/git/blobs`, { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' }, body: JSON.stringify({ content, encoding: 'utf-8' }) });
          const result = await response.json();
          if (!response.ok || result.sha !== sha) throw new Error(`Candidate blob write failed (${response.status}).`);
          const manifest = { repository, path: 'package-lock.json', sha, size: Buffer.byteLength(content), basedOn: process.env.GITHUB_SHA };
          writeFileSync('.sites-runtime/candidate-blob.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest));
          NODE
      - name: Preserve candidate for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-patch-candidate
          include-hidden-files: true
          retention-days: 7
          path: |
            package-lock.json
            .sites-runtime/dependency-changes.json
            .sites-runtime/candidate-audit.json
            .sites-runtime/candidate-blob.json
