name: Prepare dependency patch for review
on:
  push:
    branches: ['fix/dependency-patch-review-2026-10-16']
    paths: ['.github/workflows/prepare-dependency-patch.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare the reviewed dependency and type-only changes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          delete pkg.dependencies['@vercel/node'];
          pkg.dependencies.astro = '^7.4.0';
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          for (const [path, target] of [['api/_lib/handler.ts', './node-http.js'], ['api/quote.ts', './_lib/node-http.js'], ['api/appointment.ts', './_lib/node-http.js']]) {
            const source = readFileSync(path, 'utf8');
            const old = "import type { VercelRequest, VercelResponse } from '@vercel/node';";
            if (source.split(old).length !== 2) throw new Error(`Unexpected type import in ${path}.`);
            writeFileSync(path, source.replace(old, `import type { VercelRequest, VercelResponse } from '${target}';`));
          }
          NODE
          rm package-lock.json
          npx --yes --package=npm@11 npm install --package-lock-only --ignore-scripts --no-audit
      - name: Record versions and audit the candidate lock
        run: |
          mkdir -p .sites-runtime
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const original = JSON.parse(execFileSync('git', ['show', 'HEAD:package.json'], { encoding: 'utf8' }));
          delete original.dependencies['@vercel/node']; original.dependencies.astro = '^7.4.0';
          if (JSON.stringify(JSON.parse(readFileSync('package.json', 'utf8'))) !== JSON.stringify(original)) throw new Error('Unexpected package changes.');
          const changes = Object.entries(after.packages).filter(([path, item]) => item.version !== before.packages[path]?.version).map(([path, item]) => ({ path, before: before.packages[path]?.version ?? null, after: item.version, resolved: item.resolved }));
          const summary = { basedOn: process.env.GITHUB_SHA, changes, removedBuilderDependency: '@vercel/node', frameworkFloor: '^7.4.0' };
          writeFileSync('.sites-runtime/dependency-changes.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE
          npm audit --json > .sites-runtime/candidate-audit.json || test "$?" = 1
      - name: Store candidate blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const repository = 'jwillz7667/Merritts-Auto-Recycling.com';
          if (process.env.GITHUB_REPOSITORY !== repository || process.env.GITHUB_REF !== 'refs/heads/fix/dependency-patch-review-2026-10-16') throw new Error('Unexpected repository or branch.');
          const entries = [];
          for (const path of ['package.json', 'package-lock.json', 'api/_lib/handler.ts', 'api/quote.ts', 'api/appointment.ts']) {
            const content = readFileSync(path, 'utf8');
            if (content.length > 1000000) throw new Error('Unexpected candidate size.');
            const sha = createHash('sha1').update(`blob ${Buffer.byteLength(content)}\0`).update(content).digest('hex');
            const response = await fetch(`https://api.github.com/repos/${repository}/git/blobs`, { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' }, body: JSON.stringify({ content, encoding: 'utf-8' }) });
            const result = await response.json();
            if (!response.ok || result.sha !== sha) throw new Error(`Candidate blob write failed (${response.status}).`);
            entries.push({ path, sha, size: Buffer.byteLength(content) });
          }
          const manifest = { repository, entries, basedOn: process.env.GITHUB_SHA };
          writeFileSync('.sites-runtime/candidate-blob.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest));
          NODE
      - name: Preserve candidate for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-patch-candidate
          include-hidden-files: true
          retention-days: 7
          path: |
            package.json
            package-lock.json
            api/_lib/handler.ts
            api/quote.ts
            api/appointment.ts
            .sites-runtime/dependency-changes.json
            .sites-runtime/candidate-audit.json
            .sites-runtime/candidate-blob.json
