name: Lighthouse

# Performance gate. Runs on demand and weekly against production. Each
# representative page (homepage, contact, faq, testimonials, a placemark,
# a blog post) must clear the budgets in scripts/lighthouse-check.mts.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/lighthouse.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'css/**'
      - 'js/**'
      - 'scripts/_lib/transform.mts'
      - 'scripts/apply-env.mts'
      - 'scripts/apply-performance.mts'
      - 'scripts/lighthouse-check.mts'
  schedule:
    - cron: '0 11 * * 1' # Mondays 11:00 UTC

permissions:
  contents: read

env:
  NODE_VERSION: '20.19.0'

jobs:
  lighthouse:
    name: Lighthouse CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Wait for this commit to reach production
        env:
          DEPLOYMENT_MARKER: https://merritts-auto-recycling.com/deployment-sha.txt
        run: |
          for attempt in $(seq 1 60); do
            deployed_sha=$(curl --fail --silent --show-error "${DEPLOYMENT_MARKER}?run=${GITHUB_RUN_ID}" || true)
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Production is serving $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/60)..."
            sleep 10
          done
          echo "Production did not reach $GITHUB_SHA within 10 minutes" >&2
          exit 1

      - name: Run Lighthouse
        env:
          LIGHTHOUSE_BASE_URL: https://merritts-auto-recycling.com
        run: npm run lighthouse

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
